name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - name: Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1" > /dev/null
      - name: Make project
        run: |
          mkdir -p /tmp/s /tmp/ass
          unzip -oq Video_player_ready.zip -d /tmp/s
          P=/tmp/P; A=$P/app/src/main
          mkdir -p $A/java/com/asi/videoplayer $A/cpp $A/res/layout
          cd /tmp/s
          cp settings.gradle.kts gradle.properties build.gradle.kts $P/
          cp "build.gradle(1).kts" $P/app/build.gradle.kts
          cp AndroidManifest.xml $A/
          cp *.kt $A/java/com/asi/videoplayer/
          cp CMakeLists.txt asi_jni.c $A/cpp/
          cp player_surface.xml $A/res/layout/
          cd /tmp/ass
          wget -q https://repo1.maven.org/maven2/io/github/peerless2012/ass/0.3.0-beta02/ass-0.3.0-beta02.aar -O a.aar
          unzip -oq a.aar
          PKG=$(python3 -c "import json,glob;print(json.load(open(glob.glob('/tmp/ass/**/prefab.json',recursive=True)[0]))['name'])")
          MOD=$(basename $(dirname $(find /tmp/ass -path '*modules/*' -name module.json | head -1)))
          sed -i "s/@PKG@/$PKG/g; s/@MOD@/$MOD/g" $A/cpp/CMakeLists.txt
          echo "sdk.dir=$ANDROID_HOME" > $P/local.properties
      - name: Build
        run: cd /tmp/P && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AsiPlayer
          path: /tmp/P/app/build/outputs/apk/debug/app-debug.apk
